# Netlify configuration for the NXG Life Group funnel.
# When connecting the GitHub repo in Netlify, set the site's
# "Base directory" to:  LIFE FUNNEL
# (everything below is then relative to that base directory).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Pin the build's Node version so Netlify matches local/CI (Vite 5 + TS 5.6).
  NODE_VERSION = "20"
  # These are used ONLY inside netlify/functions (server-side) and are never
  # referenced in client code, so they can't leak into dist/. Tell Netlify's
  # secrets scanner not to fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "RETELL_API_KEY,RETELL_AGENT_ID,RETELL_FROM_NUMBER,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_URL,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,LEAD_FORWARD_WEBHOOK,RUNWAYML_API_SECRET"

[functions]
  node_bundler = "esbuild"

# SPA fallback for client-side routes (/quiz, /results).
# Serverless function routes (/.netlify/functions/*) are matched first by Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
